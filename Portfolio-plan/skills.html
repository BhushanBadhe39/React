<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <div id="skills-page">
        <h2 class="section-title">My Skills</h2>
        
        <div class="skills-grid">
            
            <div class="skill-column">
                <h3>Frontend</h3>
                <div class="skill-item">
                    <img src="./images/assets/icons8-html-5-50.png" alt="HTML">
                    <span>HTML</span>
                </div>
                <div class="skill-item">
                    <img src="./images/assets/icons8-css3-50.png" alt="CSS">
                    <span>CSS</span>
                </div>
                <div class="skill-item">
                    <img src="./images/assets/icons8-javascript-50.png" alt="JavaScript">
                    <span>JavaScript</span>
                </div>
                <div class="skill-item">
                    <img src="./images/assets/icons8-react-50.png" alt="React">
                    <span>React</span>
                </div>
            </div>

            <div class="skill-column">
                <h3>Backend</h3>
                <div class="skill-item">
                    <img src="./images/assets/icons8-java-50.png" alt="Java">
                    <span>Java</span>
                </div>
                <div class="skill-item">
                    <img src="./images/assets/icons8-spring-boot-50.png" alt="Spring Boot">
                    <span>Spring Boot</span>
                </div>
            </div>
            
            <div class="skill-column">
                <h3>Database</h3>
                <div class="skill-item">
                    <img src="./images/assets/icons8-mysql-50.png" alt="MySQL">
                    <span>MySQL</span>
                </div>
                <div class="skill-item">
                    <img src="./images/assets/icons8-mongodb-50.png" alt="MongoDB">
                    <span>MongoDB</span>
                </div>
            </div>
            
            <div class="skill-column">
                <h3>Tools</h3>
                <div class="skill-item">
                    <img src="./images/assets/icons8-github-50.png" alt="GitHub">
                    <span>GitHub</span>
                </div>
                <div class="skill-item">
                    <img src="./images/assets/icons8-visual-studio-code-2019-50.png" alt="VS Code">
                    <span>VS Code</span>
                </div>
                <div class="skill-item">
                    <img src="./images/assets/icons8-npm-50.png" alt="NPM">
                    <span>NPM</span>
                </div>
                <div class="skill-item">
                    <img src="./images/assets/icons8-chrome-50.png" alt="Chrome DevTools">
                    <span>Chrome DevTools</span>
                </div>
            </div>
            
        </div>
    </div>
    
    <video autoplay loop muted playsinline class="bg-video">
        <source src="./images/7198205-hd_1920_1080_25fps.mp4" type="video/mp4">
    </video>
    
</body>
</html>
