<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="contact.css">
</head>
<body>
    <video autoplay loop muted playsinline class="bg-video">
        <source src="./images/7198205-hd_1920_1080_25fps.mp4" type="video/mp4">
    </video>
    <h1 id="contact-title">Contact Me</h1>
    <h3 id="contact-quote">Let's Make Something Meaningful Together</h3>
    <div class="contact-page">
        <div class="contact-page-inner">
            <div class="contact-details">
                <img src="./images/assets/profilePic.png" id="contact-img">
                <h2>Bhushan Badhe</h2>
                <h4>Full Stack Developer | Fresher</h4>
                <p><i class="bi bi-envelope"></i>Bhushanbadhe39@gmail.com</p>
                <p><i class="bi bi-telephone"></i>+91 9067243787</p>
                <p><i class="bi bi-geo-alt"></i>Bhushanbadhe39@gmail.com</p>
                <div class="contact-socials">
                    <img src="./images/assets/icons8-github-48.png" alt="">
                    <img src="./images/assets/icons8-linkedin-48.png" alt="">
                    <img src="./images/assets/icons8-instagram-48.png" alt="">
                </div>
            </div>
            <div class="contact-form">
                <form action="">
                    <label for="name">Name: </label><br>
                    <input type="text" placeholder="Name" class="glow-input" required><br><br>
                    <label for="email">Email: </label><br>
                    <input type="email" placeholder="Email" class="glow-input" required><br><br>
                    <label for="message">Message Me: </label><br>
                    <textarea name="message" id="contact-form-msg" placeholder="Write Your Message Here" class="glow-input" required></textarea><br><br>
                    <button class="glow-btn" type="submit">Send Message</button>
                    
                </form>
            </div>
        </div>
    </div>
</body>
</html>
